# @package _global_
training:
  seed: 42
  max_epochs: 50
  max_steps: -1
  lr: 1e-4
  weight_decay: 0.01
  gradient_accumulation_steps: 1

  # MIST/ASP optimizer/checkpointing defaults
  beta1: 0.5
  beta2: 0.999
  lr_policy: linear
  lr_decay_iters: 50
  n_epochs: 100
  n_epochs_decay: 100
  save_epoch_freq: 5
  save_latest_freq: 5000
  display_freq: 2000
  print_freq: 100
  evaluation_freq: 1000
  # Weights & Biases logging (requires `wandb login` or WANDB_API_KEY)
  use_wandb: false
  wandb_project: PuzzleStain
  dry_run: false
  resume_from_checkpoint: ""
  gpu_ids: ""
