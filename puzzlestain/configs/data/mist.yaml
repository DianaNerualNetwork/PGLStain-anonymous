# @package _global_
data:
  sample_meta: null  # optional: path to sample_meta.parquet (str or list)
  patch_root: ""
  dataroot: null
  dataset_layout: mist
  panel_id: breast_mist_4plex_20x
  selected_stains: null
  panel_policy: null
  sampler: stain_balanced
  batch_size: 8
  drop_last: false
  shuffle: true
  num_workers: 4
  backend: default
  splits:
    - train
  row_filter: {}
  return_onehot: false
  max_dataset_size: 0
  aux_columns: []
  scalar_columns: []
  resize_size: null
  # Raw 1024x1024 MIST patches are 0.4661 um/px. Whole-image resize to
  # 512x512 preserves the field of view and yields 0.9322 um/px model input.
  target_mpp: 0.9322
