# @package _global_
# USIGAN loss: LSGAN + PatchNCE + UMC + PCSM + cosine-consistency matrix.
# NOTE: the patchnce/umc_consistency `batch_size` must equal the per-process
# `data.batch_size` of the experiment preset (both are feature-reshape dims).
loss:
  components:
    gan:
      gan_mode: lsgan
      weight: 1.0
    patchnce:
      nce_T: 0.07
      batch_size: 2
      nce_includes_all_negatives_from_minibatch: false
      weight: 1.0
    umc_consistency:
      eps: 1.0
      tau: 0.001
      max_iter: 50
      cost_type: easy
      scale: 10000.0
      batch_size: 2
      weight: 1.0
    pcsm:
      alpha: 1.8
      thresh_FOD: 0.15
      thresh_mask: 0.68
      scale: 1.0
      weight: 1.0
    cosine_consistency:
      scale: 10.0
      weight: 1.0
    gauss_pyramid_l1:
      num_high: 5
      weight: 1.0
