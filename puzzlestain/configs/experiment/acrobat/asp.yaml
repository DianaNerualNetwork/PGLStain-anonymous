# @package _global_
# ASP experiment: FastCUT + Gaussian-pyramid reconstruction + adaptive supervised PatchNCE.
#
# Usage:
#   python -m puzzlestain.train experiment=acrobat/asp \
#       data.dataroot=/path/to/ACROBAT/STAIN/TrainValAB \
#       data.selected_stains=[ER]
#
# Mirrors ASP experiment 0:
#   python -m experiments mist train 0

defaults:
  - override /data: default
  - override /transforms: default
  - override /task: default
  - override /model: default
  - override /loss: asp
  - override /training: default
  - override /logging: default

transforms:
  train_transforms:
    - name: synchronized_resize
      size: [512, 512]
    - name: synchronized_random_crop
      size: 512
    - name: synchronized_make_power_2
      base: 4
    - name: synchronized_random_horizontal_flip
      p: 0.5
    - name: to_tensor_normalize
      scale_to_minus_one_one: true

data:
  dataset_layout: aligned
  panel_id: breast_acrobat_4plex_10x
  target_mpp: 1.84  # raw ACROBAT tiles: ~0.92 um/px (10x); 1024 -> 512
  selected_stains: ???
  dataroot: ???           # required: one stain root containing trainA/trainB
  batch_size: 1
  sampler: simple
  shuffle: true
  drop_last: true
  splits: [train]
  num_workers: 4

training:
  max_epochs: 20          # ACROBAT schedule: 0 constant + 20 linear-decay epochs
  lr: 0.0002
  weight_decay: 0.0
  beta1: 0.5
  beta2: 0.999
  n_epochs: 0
  n_epochs_decay: 20
  lr_policy: linear
  save_epoch_freq: 5
  save_latest_freq: 5000
  log_steps: 100
  display_freq: 100

model:
  name: asp
  params:
    input_nc: 3
    output_nc: 3
    ngf: 64
    ndf: 32
    netG: resnet_6blocks
    netD: n_layers
    netF: mlp_sample
    n_layers_D: 5
    normG: instance
    normD: instance
    weight_norm: spectral
    init_type: xavier
    init_gain: 0.02
    no_dropout: true
    no_antialias: false
    no_antialias_up: false
    nce_idt: false
    lambda_GAN: 1.0
    lambda_NCE: 10.0
    nce_layers: '0,4,8,12,16'
    nce_T: 0.07
    num_patches: 256
    netF_nc: 256
    flip_equivariance: false
    lambda_gp: 10.0
    gp_weights: '[0.015625,0.03125,0.0625,0.125,0.25,1.0]'
    lambda_asp: 1.0
    asp_loss_mode: lambda_linear
    crop_size: 512
    d_lr_factor: 1.0
