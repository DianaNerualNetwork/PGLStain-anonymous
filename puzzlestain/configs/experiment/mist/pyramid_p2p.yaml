# @package _global_
# PyramidPix2Pix experiment: train HE -> target stain on MIST/IHC4BC data.
#
# Usage:
#   python -m puzzlestain.train experiment=mist/pyramid_p2p \
#       data.dataroot=/path/to/MIST/ER/TrainValAB \
#       data.selected_stains=[ER]

defaults:
  - override /data: mist
  - override /transforms: default
  - override /task: default
  - override /model: default
  - override /loss: default
  - override /training: default
  - override /logging: default

data:
  dataset_layout: aligned
  panel_id: breast_mist_4plex_20x
  selected_stains: ???    # required override, e.g. [ER]
  sample_meta: null       # optional: path to pre-built MIST_parquet/
  dataroot: ???           # required: one stain root containing trainA/trainB
  batch_size: 1
  sampler: simple
  shuffle: true
  drop_last: true
  splits: [train]

transforms:
  train_transforms:
    - name: synchronized_resize
      size: [512, 512]
    - name: synchronized_random_crop
      size: 512
    - name: synchronized_random_horizontal_flip
      p: 0.5
    - name: to_tensor_normalize
      scale_to_minus_one_one: true

training:
  max_epochs: 100
  lr: 0.0002
  weight_decay: 0.0
  beta1: 0.5
  beta2: 0.999
  n_epochs: 50
  n_epochs_decay: 50
  save_epoch_freq: 20
  save_latest_freq: 5000
  log_steps: 100

model:
  name: pix2pix_pyramid
  params:
    netG: resnet_9blocks
    netD: basic
    ngf: 64
    ndf: 64
    # Original PyramidP2P trains with Dropout(0.5) in every ResNet block
    # (its no_dropout flag defaults to False); keep it on for parity.
    use_dropout: true
    d_lr_factor: 1.0

loss:
  components:
    gan:
      gan_mode: vanilla
      weight: 1.0
    pyramid_l1:
      num_scales: 4
      weight: 25.0
