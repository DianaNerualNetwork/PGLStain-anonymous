# @package _global_
# Full PGLStain: CPT + PECC + MRSA.
defaults:
  - override /data: default
  - override /transforms: default
  - override /task: default
  - override /model: default
  - override /loss: pglstain_full
  - override /training: default
  - override /logging: default

transforms:
  train_transforms:
    - name: synchronized_resize
      size: [512, 512]
    - name: synchronized_random_crop
      size: 512
    - name: synchronized_make_power_2
      base: 4
    - name: synchronized_random_horizontal_flip
      p: 0.5
    - name: to_tensor_normalize
      scale_to_minus_one_one: true

data:
  dataset_layout: aligned
  panel_id: breast_ihc_4plex_40x
  selected_stains: ???
  dataroot: ???
  batch_size: 1
  sampler: simple
  shuffle: true
  drop_last: true
  splits: [train]
  num_workers: 4

training:
  seed: 42
  max_epochs: 100
  lr: 0.0002
  weight_decay: 0.0
  beta1: 0.5
  beta2: 0.999
  n_epochs: 50
  n_epochs_decay: 50
  lr_policy: linear
  save_epoch_freq: 20
  save_latest_freq: 5000
  log_steps: 100
  display_freq: 100

model:
  name: pglstain
  params:
    input_nc: 3
    output_nc: 3
    ngf: 64
    ndf: 32
    netG: resnet_6blocks
    netD: n_layers
    netF: mlp_sample
    n_layers_D: 5
    normG: instance
    normD: instance
    init_type: xavier
    init_gain: 0.02
    no_dropout: true
    no_antialias: false
    no_antialias_up: false
    nce_idt: true
    lambda_GAN: 1.0
    lambda_NCE: 1.0
    nce_layers: '0,4,8,12,16'
    nce_T: 0.07
    num_patches: 256
    netF_nc: 256
    flip_equivariance: false
    lambda_gp: 10.0
    gp_weights: '[0.015625,0.03125,0.0625,0.125,0.25,1.0]'
    lambda_pecc: 0.1
    lambda_od_struct: 0.1
    pecc_layers: '8,12,16'
    # Calibration on 100 incumbent predictions: raw mean 0.0119, median 0.00535.
    # 5.0 keeps this term corrective (typically ~0.03-0.06 after weighting).
    lambda_od_set: 5.0
    lambda_od_graph: 1.0
    weight_norm: spectral
    crop_size: 512
    d_lr_factor: 1.0
