# @package _global_
# PPT experiment: LSGAN + bidirectional FocalNCE + patch alignment + VGG
# content + Gaussian-pyramid frequency loss (MICCAI 2024,
# "High-resolution Medical Image Translation via Patch Alignment-based
# Bidirectional Contrastive Learning").
#
# Usage:
#   python -m puzzlestain.train experiment=mist/ppt \
#       data.dataroot=/path/to/MIST/ER/TrainValAB \
#       data.selected_stains=[ER]
#
# Mirrors the original PPT command:
#   python train.py --dataroot .../TrainValAB --name mist_er
# (all other options are the repository defaults).
#
# MIST benchmark spatial protocol: whole-image resize to 512x512 with bilinear
# interpolation, then retain a synchronized shape-preserving 512x512 crop.

defaults:
  - override /data: mist
  - override /transforms: default
  - override /task: default
  - override /model: default
  - override /loss: ppt
  - override /training: default
  - override /logging: default

transforms:
  train_transforms:
    # The shared MIST protocol uses a whole-image 512 resize followed by a
    # shape-preserving synchronized 512 crop. The original torchvision tensor
    # Resize interpolation is bilinear with antialias; PIL
    # BILINEAR matches it to within 1/255 per pixel.
    - name: synchronized_resize
      size: [512, 512]
      interpolation: bilinear
    - name: synchronized_random_crop
      size: 512
    - name: to_tensor_normalize
      scale_to_minus_one_one: true

data:
  dataset_layout: aligned
  panel_id: breast_mist_4plex_20x
  selected_stains: ???    # required override, e.g. [ER]
  dataroot: ???           # required: path to raw aligned data root
  batch_size: 1
  sampler: simple
  shuffle: true
  drop_last: true
  splits: [train]
  num_workers: 4

training:
  max_epochs: 100          # niter 50 + niter_decay 50
  lr: 0.0002
  weight_decay: 0.0
  beta1: 0.5
  beta2: 0.999
  n_epochs: 50
  n_epochs_decay: 50
  lr_policy: linear        # original lr_policy 'lambda' == pix2pix linear rule
  save_epoch_freq: 5
  save_latest_freq: 5000
  log_steps: 100
  display_freq: 100

model:
  name: ppt
  params:
    input_nc: 3
    output_nc: 3
    ngf: 64
    ndf: 64
    netG: resnet_9blocks   # PPT variant: 4 down/upsampling stages, 9 blocks
    netD: n_layers
    netF: mlp_sample
    n_layers_D: 3
    normG: instance
    normD: instance
    init_type: normal
    init_gain: 0.02
    no_dropout: true
    no_antialias: false
    no_antialias_up: false
    nce_idt: true
    lambda_GAN: 1.0
    lambda_NCE: 1.0
    nce_layers: '0,4,8,12,16'
    nce_T: 0.07
    num_patches: 256
    netF_nc: 256
    flip_equivariance: false
    crop_size: 512
    weight_norm: none
    d_lr_factor: 1.0
