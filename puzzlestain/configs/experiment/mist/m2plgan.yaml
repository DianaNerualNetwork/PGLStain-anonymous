# @package _global_
# M2PL-GAN experiment: FastCUT + CACM + LDAM + GBCLM.
#
# Usage:
#   python -m puzzlestain.train experiment=mist/m2plgan \
#       data.dataroot=/path/to/MIST/ER/TrainValAB \
#       data.selected_stains=[ER]
#
# Mirrors the original M2PL-GAN command:
#   python train.py --dataroot .../TrainValAB --model m2plgan --CUT_mode FastCUT \
#       --netD n_layers --ndf 32 --netG resnet_6blocks --n_layers_D 5 \
#       --normG instance --normD instance --weight_norm spectral \
#       --lambda_GAN 1.0 --lambda_NCE 1.0 --nce_layers 0,4,8,12,16 \
#       --nce_T 0.07 --num_patches 256 --dataset_mode aligned --batch_size 1 \
#       --flip_equivariance False --CACM=1.0 --LDAM=10.0 --patchwpatch \
#       --GBCLM=0.1 --conv_type=tag --patchsize=64

defaults:
  - override /data: mist
  - override /transforms: default
  - override /task: default
  - override /model: default
  - override /loss: m2plgan
  - override /training: default
  - override /logging: default

transforms:
  train_transforms:
    - name: synchronized_resize
      size: [512, 512]
    - name: synchronized_random_crop
      size: 512
    - name: synchronized_random_horizontal_flip
      p: 0.5
    - name: synchronized_make_power_2
      base: 4
    - name: to_tensor_normalize
      scale_to_minus_one_one: true

data:
  dataset_layout: aligned
  panel_id: breast_mist_4plex_20x
  selected_stains: ???    # required override, e.g. [ER]
  dataroot: ???           # required: path to raw aligned data root
  batch_size: 1
  sampler: simple
  shuffle: true
  drop_last: true
  splits: [train]
  num_workers: 4

training:
  max_epochs: 100          # niter 50 + niter_decay 50
  lr: 0.0002
  weight_decay: 0.0
  beta1: 0.5
  beta2: 0.999
  n_epochs: 50
  n_epochs_decay: 50
  lr_policy: linear
  save_epoch_freq: 5
  save_latest_freq: 5000
  log_steps: 100
  display_freq: 100

model:
  name: m2plgan
  params:
    input_nc: 3
    output_nc: 3
    ngf: 64
    ndf: 32
    netG: resnet_6blocks
    netD: n_layers
    netF: mlp_sample
    n_layers_D: 5
    normG: instance
    normD: instance
    init_type: xavier
    init_gain: 0.02
    no_dropout: true
    no_antialias: false
    no_antialias_up: false
    nce_idt: false
    lambda_GAN: 1.0
    lambda_NCE: 1.0
    nce_layers: '0,4,8,12,16'
    nce_T: 0.07
    num_patches: 256
    netF_nc: 256
    flip_equivariance: false
    lambda_CACM: 1.0
    lambda_LDAM: 10.0
    lambda_GBCLM: 0.1
    patchsize: 64
    crop_size: 512
    weight_norm: spectral
    d_lr_factor: 1.0
